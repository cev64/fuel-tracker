name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the APK to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      # The keystore lives only in repository secrets. Without it the workflow
      # stops rather than shipping an APK signed with the debug key, which the
      # phone would refuse to install over a previous release.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FUEL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FUEL_KEYSTORE_BASE64 secret is not set. See README > APK signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-release.jks"

      - name: Build release APK
        env:
          FUEL_KEYSTORE_FILE: ${{ runner.temp }}/fuel-release.jks
          FUEL_KEYSTORE_PASSWORD: ${{ secrets.FUEL_KEYSTORE_PASSWORD }}
          FUEL_KEY_ALIAS: ${{ secrets.FUEL_KEY_ALIAS }}
          FUEL_KEY_PASSWORD: ${{ secrets.FUEL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "fuel-v${VERSION}.apk"
          echo "APK_NAME=fuel-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuel-release-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fuel-release.jks"
