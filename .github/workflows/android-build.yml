name: Android build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    # Signing values are set for every Gradle step, so the signing config is
    # resolved the same way whichever task runs.
    env:
      FUEL_KEYSTORE_FILE: ${{ runner.temp }}/fuel-signing.jks
      FUEL_KEYSTORE_PASSWORD: ${{ secrets.FUEL_KEYSTORE_PASSWORD }}
      FUEL_KEY_ALIAS: ${{ secrets.FUEL_KEY_ALIAS }}
      FUEL_KEY_PASSWORD: ${{ secrets.FUEL_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this the runner generates a throwaway debug key per build, so
      # every APK is signed by a different identity and Android refuses to
      # update an existing install. See README > APK signing.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FUEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$FUEL_KEYSTORE_FILE"
            echo "Signing with the persistent Fuel key."
          else
            echo "::warning title=No persistent signing key::FUEL_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and will NOT install over an existing Fuel install. See README > APK signing."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "fuel-v${VERSION}-debug.apk"
          echo "APK_NAME=fuel-v${VERSION}-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fuel-debug-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$FUEL_KEYSTORE_FILE"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
